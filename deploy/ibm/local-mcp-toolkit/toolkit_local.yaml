spec_version: v1
kind: mcp
name: gsa_graj_tools_local
description: >
  gsa_graj_tools local stdio toolkit — weather, jokes, unit conversion,
  and PostgreSQL tools (connect_sl_db, read_from_sl, write_to_sl,
  aggregate_operational_tbl, count_records).
  Runs over stdio inside the watsonx Orchestrate runtime.
  Credentials are injected via a key_value connection (PG_HOST, PG_PORT,
  PG_DB, PG_USER, PG_PASS or DATABASE_URL).
command: python server.py
env: []
tools:
  - "*"
# package_root is set at import time by stage.sh after staging the files.
# Run:  bash deploy/ibm/local-mcp-toolkit/stage.sh
#       orchestrate toolkits import -f deploy/ibm/local-mcp-toolkit/toolkit_local.yaml
package_root: deploy/ibm/local-mcp-toolkit/_stage
